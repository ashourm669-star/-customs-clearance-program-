<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1d36" />
  <title>العربي | بدون اتصال</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #071426, #0d3550); color: #fff; text-align: center;
    }
    .box { max-width: 420px; }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 20px;
      display: grid; place-items: center; font-size: 32px; font-weight: 700;
      background: linear-gradient(135deg, #20c4a9, #0b7f78); box-shadow: 0 14px 30px rgba(14,159,138,.3);
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { font-size: 13px; line-height: 1.9; color: rgba(255,255,255,.65); margin: 0 0 24px; }
    button {
      border: 0; border-radius: 12px; padding: 12px 26px; font: 600 14px inherit;
      background: #20c4a9; color: #041d2b; cursor: pointer;
    }
    button:hover { background: #35d8bd; }
    .hint { margin-top: 24px; font-size: 11px; color: rgba(255,255,255,.4); }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">ع</div>
    <h1>لا يوجد اتصال بالإنترنت حالياً</h1>
    <p>تطبيق العربي محتاج اتصال بالخادم لعرض الشحنات والبيانات الجمركية. تأكد من اتصالك ثم أعد المحاولة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <div class="hint">الشركة العربي للخدمات الجمركية واللوجستية</div>
  </div>
</body>
</html>
